name: Indexer cron

# Drives the smart-money pipeline by pinging the deployed API on a schedule.
# This replaces Vercel's built-in cron (which is capped at once/day on the Hobby
# plan). GitHub Actions has no such cap and adds a manual "Run workflow" button.
#
# The endpoints do the work inside Vercel; this only triggers them over HTTP.
#
# If CRON_SECRET is set in Vercel, add the same value as a repo secret named
# CRON_SECRET (Settings -> Secrets and variables -> Actions). If it's not set,
# the endpoints are open and the empty header is ignored.

on:
  schedule:
    - cron: '0 */2 * * *' # every 2h  -> token-first index
    - cron: '30 */1 * * *' # hourly   -> drain deep-scan backlog (verify wallets)
    - cron: '15 */3 * * *' # every 3h -> capture graduated coins (every wallet)
    - cron: '45 */6 * * *' # every 6h -> chain discovery (follow proven winners)
    - cron: '30 */6 * * *' # every 6h -> link tracking (follow SOL out of winners)
  workflow_dispatch: {} # manual "Run workflow" button (runs everything)

concurrency:
  group: indexer-cron
  cancel-in-progress: false

env:
  BASE_URL: https://transport-topaz-eight.vercel.app

jobs:
  index:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger token-first indexer
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/index" | head -c 2000
          echo

  refine:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 */1 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Drain deep-scan backlog (verify wallets)
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/seed-wallets" | head -c 2000
          echo

  graduations:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Capture graduated coins (every wallet)
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/graduations" | head -c 2000
          echo

  chain-discovery:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Chain discovery (follow proven winners)
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/chain-discovery" | head -c 2000
          echo

  track-links:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Link tracking (follow SOL out of winners)
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$BASE_URL/api/cron/track-links" | head -c 2000
          echo
