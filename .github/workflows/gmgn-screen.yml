name: GMGN screen

# Cheap pre-screen tier: runs gmgn-cli (which CANNOT run on Vercel) to fetch
# GMGN's precomputed PnL for backlog wallets, then POSTs results to transport so
# the expensive Helius deep-scan only verifies the promising ones.
#
# REQUIRED before this works:
#   1. Repo secrets (Settings -> Secrets and variables -> Actions):
#        GMGN_API_KEY   - key gmgn-cli uses
#        CRON_SECRET    - only if transport has CRON_SECRET set
#   2. Repo variable (or hardcode below):
#        TRANSPORT_URL  - e.g. https://transport-topaz-eight.vercel.app
# gmgn-cli is installed from npm in the "Install gmgn-cli" step below, so CI can
# run this workflow on demand via the "Run workflow" button (workflow_dispatch).

# This workflow is MANUAL-ONLY (workflow_dispatch) by default and can be
# triggered from the Actions tab. The scheduled trigger is intentionally left
# commented out — see the activation checklist directly above the `schedule:`
# block before enabling it.
on:
  workflow_dispatch: {}
  # =====================================================================
  # TO ACTIVATE SCHEDULED RUNS, FIRST DO ALL OF THE FOLLOWING, THEN
  # UNCOMMENT THE `schedule:` BLOCK BELOW:
  #
  #   1. Add these GitHub repo Secrets (Settings -> Secrets and variables
  #      -> Actions -> Repository secrets):
  #        GMGN_API_KEY   - API key gmgn-cli authenticates with
  #        CRON_SECRET    - must match transport's CRON_SECRET (if set)
  #        TRANSPORT_URL  - e.g. https://transport-topaz-eight.vercel.app
  #
  # WHY THIS IS GATED: enabling the schedule BEFORE the secrets exist would
  # produce failing scheduled runs every 2h (and the failure-notification
  # emails that come with them). Add the secrets first, verify a manual
  # run via "Run workflow", THEN uncomment the schedule below.
  # =====================================================================
  # schedule:
  #   - cron: '20 */2 * * *' # every 2h, offset from the other jobs

concurrency:
  group: gmgn-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # gmgn-cli is published on npm; install it globally so `gmgn` is on PATH.
      - name: Install gmgn-cli
        run: npm install -g gmgn-cli@1.4.3

      - name: Screen backlog via GMGN
        env:
          TRANSPORT_URL: ${{ vars.TRANSPORT_URL || 'https://transport-topaz-eight.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          MAX_WALLETS: '200'
        run: node scripts/gmgn-screen.mjs
