name: GMGN screen

# Cheap pre-screen tier: runs gmgn-cli (which CANNOT run on Vercel) to fetch
# GMGN's precomputed PnL for backlog wallets, then POSTs results to transport so
# the expensive Helius deep-scan only verifies the promising ones.
#
# REQUIRED for this to succeed (scheduled AND manual runs):
#   1. Repo secrets (Settings -> Secrets and variables -> Actions -> Repository secrets):
#        GMGN_API_KEY   - API key gmgn-cli authenticates with
#        CRON_SECRET    - must match transport's CRON_SECRET (if set)
#   2. TRANSPORT_URL defaults to the prod URL below; override via repo variable
#      `TRANSPORT_URL` if your deployment differs.
#
# gmgn-cli is installed from npm in the "Install gmgn-cli" step, so CI has the
# binary GMGN screening needs.

on:
  workflow_dispatch: {}
  # Scheduled every 2h (offset from the other jobs). Note: schedules only run
  # from the DEFAULT branch. Runs will FAIL until GMGN_API_KEY and CRON_SECRET
  # are added as repo secrets (see header) — add them before/at merge to avoid
  # failure-notification emails.
  schedule:
    - cron: '20 */2 * * *' # every 2h, offset from the other jobs

concurrency:
  group: gmgn-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # gmgn-cli is published on npm; install it globally so `gmgn` is on PATH.
      - name: Install gmgn-cli
        run: npm install -g gmgn-cli@1.4.3

      - name: Screen backlog via GMGN
        env:
          TRANSPORT_URL: ${{ vars.TRANSPORT_URL || 'https://transport-topaz-eight.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          MAX_WALLETS: '200'
        run: node scripts/gmgn-screen.mjs
